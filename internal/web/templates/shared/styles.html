{{define "pageStyles"}}
<style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f6f2f5;
      color: #281d26;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main {
      width: min(100%, 25rem);
      padding: clamp(1.25rem, 5vw, 2rem);
      background: #fff;
      border: 1px solid #e8dce5;
      border-radius: 1rem;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .375rem; }
    .registration { width: min(100%, 36rem); }
    .field-row { display: grid; gap: 1rem; }
    @media (min-width: 36rem) {
      .field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    input, select, button {
      width: 100%;
      min-width: 0;
      min-height: 2.75rem;
      padding: .625rem .75rem;
      border: 1px solid #9c8796;
      border-radius: .5rem;
      font: inherit;
    }
    button {
      background: #892952;
      color: #fff;
      border-color: #892952;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #702043; }
    :focus-visible { outline: 2px solid #892952; outline-offset: 3px; }
    a { color: #702043; }
    .notice { color: #702043; }
    .with-navigation { display: block; padding: 0; }
    .with-navigation > main { max-width: calc(100% - 2rem); margin: 1.5rem auto; }
    .site-header { background: #fff; border-bottom: 1px solid #e8dce5; padding: 0 1rem; }
    .site-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 .375rem; max-width: 52rem; margin: 0 auto; }
    .site-nav a {
      padding: .75rem .375rem;
      text-align: center;
      border-bottom: 2px solid transparent;
      color: #695761;
      text-decoration: none;
      font-weight: 600;
    }
    .site-nav a:hover { background: #fcf8fa; }
    .site-nav a[aria-current] { border-bottom-color: #892952; color: #702043; }
    @media (max-width: 32rem) {
      .site-nav a { padding-inline: .125rem; font-size: .875rem; }
    }
  </style>
{{end}}
