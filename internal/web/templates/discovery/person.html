<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.FirstName}} — Анкета Svaha</title>
  {{template "pageStyles"}}
  <style>
    .person { width: min(100%, 36rem); overflow-wrap: anywhere; }
    .person h1 { margin: .5rem 0 0; }
    .person-city { color: #695761; margin: .25rem 0 0; }
    .person-photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .75rem; padding: 0; list-style: none; }
    .person-photos img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .5rem; }
    .person-text { white-space: pre-wrap; }
  </style>
</head>
<body class="with-navigation">
  {{template "mainNavigation" .Navigation}}
  <main class="person">
    <a href="{{.BackURL}}">{{.BackLabel}}</a>
    <h1>{{.FirstName}}</h1>
    {{if .City}}<p class="person-city">{{.City}}</p>{{end}}
    {{if .PhotoIDs}}
    <ul class="person-photos" aria-label="Фотографии анкеты">
      {{range $index, $id := .PhotoIDs}}
      <li><a href="/people/{{$.ID}}/photo/{{$id}}"><img src="/people/{{$.ID}}/photo/{{$id}}" alt="Фото {{$index | photoNumber}}" loading="lazy"></a></li>
      {{end}}
    </ul>
    {{end}}
    {{if .Bio}}<section><h2>О себе</h2><p class="person-text">{{.Bio}}</p></section>{{end}}
    {{if .Hobbies}}<section><h2>Увлечения</h2><p class="person-text">{{.Hobbies}}</p></section>{{end}}
  </main>
</body>
</html>
